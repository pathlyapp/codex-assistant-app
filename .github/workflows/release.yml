name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify tag version
        run: node tauri-gui/tools/check-version.mjs "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v7
        with:
          name: codex-assistant-release-bundle
          path: release-assets
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --prerelease
