name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            platform: windows
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            runs-on: [self-hosted, windows]
          # windows-arm64 已暂停发布：self-hosted ARM64 runner 缺少 ARM64 LLVM/Clang
          # 工具链，恢复前需先完成 runner 环境配置。
          - name: macos-arm64
            platform: macos
            arch: arm64
            runs-on: macos-latest
    defaults:
      run:
        working-directory: tauri-gui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-gui/package-lock.json
      # Windows job 不使用 dtolnay/rust-toolchain：该 action 内部依赖 bash，
      # 而 self-hosted runner 上 bash 会解析到 WSL 导致失败。Windows 步骤统一使用
      # 系统自带的 Windows PowerShell（self-hosted runner 未安装 pwsh）。
      - name: Install Rust toolchain (macOS)
        if: matrix.platform == 'macos'
        uses: dtolnay/rust-toolchain@stable
      - name: Configure Rust toolchain (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          # Windows PowerShell 的 >> 会写出 UTF-16，GITHUB_PATH 必须是 UTF-8。
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rustup target add ${{ matrix.rust_target }}
          rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-gui/src-tauri -> target
      - run: npm ci
      - run: node tools/check-version.mjs ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Prepare macOS signing assets
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          keychain_password="$(openssl rand -hex 16)"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          api_key_path="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"
          security create-keychain -p "$keychain_password" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security import "$certificate_path" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed -e 's/[" ]//g')
          security default-keychain -d user -s build.keychain
          rm -f "$certificate_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Build signed and notarized app (macOS)
        if: matrix.platform == 'macos'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: npm run build:mac:signed

      - name: Build signed NSIS installer (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        env:
          WIN_SIGN_PIN: ${{ secrets.WIN_SIGN_PIN }}
        run: tools/windows-build.ps1 -Architecture ${{ matrix.arch }} -Sign -SkipNpmInstall

      - uses: actions/upload-artifact@v6
        with:
          name: codex-assistant-${{ matrix.name }}
          path: tauri-gui/artifact/*
          if-no-files-found: error
          retention-days: 5

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify tag version
        run: node tauri-gui/tools/check-version.mjs "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v7
        with:
          pattern: codex-assistant-*
          path: release-assets
          merge-multiple: true
      - name: Generate manifest and release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          node tauri-gui/tools/generate-release-manifest.mjs \
            --version "$version" \
            --input release-assets \
            --channel internal-test
          node tauri-gui/tools/generate-release-notes.mjs \
            --manifest release-assets/package-manifest.json \
            --output release-assets/RELEASE-NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }} internal test build
          body_path: release-assets/RELEASE-NOTES.md
          prerelease: true
          make_latest: false
          files: release-assets/*

      - name: Notify Feishu on success
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${FEISHU_WEBHOOK_URL:-}" ]; then
            echo "FEISHU_WEBHOOK_URL secret is not configured; skipping notification."
            exit 0
          fi
          release_url="https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"
          artifact_lines=$(ls release-assets | sed 's/^/• /')
          text=$(printf '🎉 Codex 助手构建发布成功\n\n仓库：%s\n版本：%s\n发布者：%s\n\n📦 产物：\n%s\n\nGitHub Release：%s' \
            "${{ github.repository }}" "${GITHUB_REF_NAME}" "${{ github.actor }}" "$artifact_lines" "$release_url")
          jq -n --arg text "$text" '{msg_type: "text", content: {text: $text}}' |
            curl -fsS -X POST -H "Content-Type: application/json" --max-time 30 -d @- "$FEISHU_WEBHOOK_URL"

      - name: Notify Feishu on failure
        if: failure()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${FEISHU_WEBHOOK_URL:-}" ]; then
            echo "FEISHU_WEBHOOK_URL secret is not configured; skipping notification."
            exit 0
          fi
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          text=$(printf '❌ Codex 助手发布失败\n\n仓库：%s\n版本：%s\n发布者：%s\n\n日志：%s' \
            "${{ github.repository }}" "${GITHUB_REF_NAME}" "${{ github.actor }}" "$run_url")
          jq -n --arg text "$text" '{msg_type: "text", content: {text: $text}}' |
            curl -fsS -X POST -H "Content-Type: application/json" --max-time 30 -d @- "$FEISHU_WEBHOOK_URL"
