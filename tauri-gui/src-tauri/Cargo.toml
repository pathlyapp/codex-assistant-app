[package]
name = "company-codex-tauri-gui"
version = "0.8.5"
description = "Codex Assistant"
edition = "2021"

[lib]
name = "company_codex_tauri_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tungstenite = "0.30"
toml_edit = "0.25"
ureq = { version = "2.12", features = ["json"] }
url = "2"
